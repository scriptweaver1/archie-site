<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem('ageVerified')!=='true')document.documentElement.classList.add('age-locked')}catch(e){document.documentElement.classList.add('age-locked')}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchangelsBabe · Masterlist</title>
  <meta name="description" content="The audio masterlist of u/ArchangelsBabe. 18+ only.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="masterlist">
  <div class="sky" id="sky" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader"></header>

  <main id="main">
    <section class="hero">
      <span class="halo" aria-hidden="true"></span>
      <h1>Masterlist</h1>
      <p id="tagline"></p>
    </section>

    <div class="toolbar">
      <label class="sr-only" for="search">Search audios</label>
      <input class="field" id="search" type="search" placeholder="Search titles, tags, or words in the summary…" autocomplete="off">
      <label class="sr-only" for="sort">Sort by</label>
      <select class="field" id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="az">A – Z</option>
      </select>
    </div>

    <nav aria-label="Filter by category"><ul class="pills" id="pills"></ul></nav>
    <p class="result-count" id="count" role="status" aria-live="polite"></p>

    <div class="grid" id="grid"></div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/masterlist.js"></script>
</body>
</html>
